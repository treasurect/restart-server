server:
  port: 8080
  address: 0.0.0.0

spring:
  #local
  config:
    import: optional:file:${user.home}/.config/restart-server/application.properties

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/restart?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 90MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

file:
  upload-path: /opt/restart-server/${file.upload-dir}
  upload-dir: uploads/

deepseek:
  api-key: ${DEEPSEEK_API_KEY}
  base-url: https://api.deepseek.com
  model: deepseek-flash
  connect-timeout: 10s
  response-timeout: 180s

#local
jwt:
  secret: ${JWT_SECRET}